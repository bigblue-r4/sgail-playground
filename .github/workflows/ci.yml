name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            xray/target
          key: xray-${{ hashFiles('xray/Cargo.lock') }}
      - name: Test (examples are the fixture)
        working-directory: xray
        run: cargo test --locked
      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --version 0.15.0 --locked
      - name: Build for the browser
        working-directory: xray
        run: wasm-pack build --release --target web --no-typescript --out-dir ../site/pkg
      - name: Smoke test the browser build
        run: node scripts/smoke.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: witness/go.sum
      - name: Test the witness (ports checked against the real store)
        working-directory: witness
        run: go test ./...
      - name: Build the witness for the browser
        working-directory: witness
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o ../site/witness/witness.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../site/witness/ 2>/dev/null \
            || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ../site/witness/
      - name: Package the site
        run: rm -f site/pkg/.gitignore site/pkg/package.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
